<aside
  class="relative bg-zinc-900 text-zinc-100 border-r border-b border-zinc-800 flex flex-col justify-between h-[95vh] transition-all duration-300 select-none rounded-br-xl"
  [class.w-64]="!isCollapsed"
  [class.w-20]="isCollapsed"
  [class.p-6]="!isCollapsed"
  [class.p-3]="isCollapsed"
>
  <button
    type="button"
    (click)="toggleSidebar()"
    aria-label="Recolher ou expandir Sidebar"
    class="absolute -right-3 top-10 z-10 flex h-6 w-6 items-center justify-center rounded-full border border-zinc-700 bg-zinc-800 text-zinc-300 shadow-md hover:bg-red-600 hover:border-red-600 hover:text-white cursor-pointer transition-colors"
  >
    @if (isCollapsed) {
      <ng-icon name="lucideChevronRight" size="14" />
    } @else {
      <ng-icon name="lucideChevronLeft" size="14" />
    }
  </button>

  <div class="w-full space-y-6">
    <div class="flex items-center justify-center py-2">
      <img
        src="/images/f1-logo.png"
        alt="Logo F1"
        class="object-contain transition-all duration-300"
        [class.h-12]="!isCollapsed"
        [class.h-7]="isCollapsed"
      />
    </div>

    <hr class="border-zinc-800 my-4" />

    <nav class="flex flex-col gap-2">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-red-600/15 text-red-500"
        class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-white"
      >
        <ng-icon name="lucideLayoutDashboard" size="20" class="shrink-0" />
        @if (!isCollapsed) {
          <span class="text-sm font-medium whitespace-nowrap">Dashboard</span>
        }
      </a>

      <a
        routerLink="/constructors"
        routerLinkActive="bg-red-600/15 text-red-500"
        class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-white"
      >
        <ng-icon name="lucideFlagTriangleRight" size="20" class="shrink-0" />
        @if (!isCollapsed) {
          <span class="text-sm font-medium whitespace-nowrap">Constructors</span>
        }
      </a>

      <a
        routerLink="/drivers"
        routerLinkActive="bg-red-600/15 text-red-500"
        class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-white"
      >
        <ng-icon name="lucideUsers" size="20" class="shrink-0" />
        @if (!isCollapsed) {
          <span class="text-sm font-medium whitespace-nowrap">Drivers</span>
        }
      </a>

      <a
        routerLink="/races"
        routerLinkActive="bg-red-600/15 text-red-500"
        class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-white"
      >
        <ng-icon name="lucideCalendarDays" size="20" class="shrink-0" />
        @if (!isCollapsed) {
          <span class="text-sm font-medium whitespace-nowrap">Races</span>
        }
      </a>

      <a
        routerLink="/statistics"
        routerLinkActive="bg-red-600/15 text-red-500"
        class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-white"
      >
        <ng-icon name="lucideChartNoAxesCombined" size="20" class="shrink-0" />
        @if (!isCollapsed) {
          <span class="text-sm font-medium whitespace-nowrap">Statistics</span>
        }
      </a>
    </nav>
  </div>

  <div class="w-full space-y-4">
    <a
      routerLink="/settings"
      routerLinkActive="bg-red-600/15 text-red-500"
      class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-white"
    >
      <ng-icon name="lucideSettings" size="20" class="shrink-0" />
      @if (!isCollapsed) {
        <span class="text-sm font-medium whitespace-nowrap">Settings</span>
      }
    </a>

    <hr class="border-zinc-800 my-2" />

    <div class="flex items-center gap-3 px-2 py-1">
      <img
        src="/images/Perfil.png"
        alt="Foto de perfil"
        class="w-9 h-9 rounded-full object-cover shrink-0 border border-zinc-700"
      />
      @if (!isCollapsed) {
        <div class="flex flex-col min-w-0 overflow-hidden">
          <p class="text-zinc-100 text-sm font-medium truncate">Cauã Rodolpho</p>
          <p class="text-zinc-400 text-xs truncate">Developer</p>
        </div>
      }
    </div>
  </div>
</aside>
