<header class="w-full bg-f1-sidebar/85 backdrop-blur-md border-b border-f1-border">
  <!-- Barra Superior -->
  <div class="flex items-center justify-between px-8 py-3 border-b border-f1-border/60">
    <span class="text-xs font-semibold tracking-widest text-slate-400 uppercase">
      2026 SEASON
    </span>

    <div class="flex items-center gap-4">
      <button
        type="button"
        aria-label="Notificações"
        class="text-slate-400 hover:text-white transition-colors p-1.5 rounded-lg hover:bg-f1-elevated cursor-pointer"
      >
        <ng-icon name="lucideBell" size="18" />
      </button>

      <span
        class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-f1-red/15 text-f1-red border border-f1-red/30 uppercase tracking-wider"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-f1-red animate-pulse"></span>
        LIVE
      </span>
    </div>
  </div>

  <!-- Título da Página -->
  <div class="px-8 py-4">
    <h1 class="text-2xl font-extrabold tracking-wider text-white uppercase">
      {{ pageTitle() }}
    </h1>
  </div>
</header>
